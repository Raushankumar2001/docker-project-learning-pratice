name: Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Backend Docker Image
      - name: Build Backend Image

        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:v1 ./backend

      # Push Backend Docker Image
      - name: Push Backend Image

        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:v1

      # Build Frontend Docker Image
      - name: Build Frontend Image

        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:v1 ./frontend

      # Push Frontend Docker Image
      - name: Push Frontend Image

        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:v1
